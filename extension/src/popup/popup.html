<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dehype</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="popup-container">
    <header id="header">
      <div id="logo-title-area">
        <span id="logo-mark" aria-hidden="true">
          <img src="../../img/Dehype.png" alt="" id="header-icon">
        </span>
        <span id="extension-name">Dehype</span>
      </div>
      <button id="close-btn" type="button" aria-label="Close popup">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M5.75 5.75 14.25 14.25M14.25 5.75 5.75 14.25" />
        </svg>
      </button>
    </header>

    <section id="button-row" aria-label="Page actions">
      <button
        id="neutralize-btn"
        class="action-btn action-btn-primary"
        type="button"
      >Neutralize</button>
      <button
        id="restore-btn"
        class="action-btn action-btn-secondary"
        type="button"
      >Restore</button>
    </section>

    <footer id="status-row" role="status" aria-live="polite">
      <span id="status-indicator" class="status-green" aria-hidden="true"></span>
      <span id="status-text">Extension ready</span>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
