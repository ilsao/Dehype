<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dehype</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main id="popup-container">
      <header id="header">
        <div id="logo-title-area">
          <img src="../../img/Dehype.png" alt="" id="header-icon">
          <span id="extension-name">Dehype</span>
        </div>
        <button id="close-btn" class="icon-button" type="button" aria-label="Close" title="Close">&times;</button>
      </header>

      <form id="settings-form">
        <div class="field-row">
          <label for="provider">AI provider</label>
          <select id="provider" name="provider">
            <option value="openai">ChatGPT / OpenAI</option>
            <option value="gemini">Gemini</option>
            <option value="claude">Claude</option>
          </select>
        </div>

        <div class="field-row">
          <label for="model">Model</label>
          <input id="model" name="model" type="text" autocomplete="off" value="gpt-4.1-mini">
        </div>

        <div class="field-row">
          <label for="api-key">API key</label>
          <input id="api-key" name="apiKey" type="password" autocomplete="off" placeholder="Enter your API key">
        </div>

        <button id="save-btn" class="secondary-button" type="submit">Save settings</button>
        <p class="storage-note">Stored locally in this Chrome profile.</p>
      </form>

      <div id="button-row">
        <button id="neutralize-btn" class="action-button primary-button" type="button">Neutralize</button>
        <button id="restore-btn" class="action-button secondary-button" type="button">Restore</button>
      </div>

      <section id="model-result" hidden>
        <h2>Model answer</h2>
        <pre id="model-output"></pre>
      </section>

      <div id="status-row" role="status" aria-live="polite">
        <span id="status-indicator" class="status-neutral"></span>
        <span id="status-text">Enter and save your AI settings.</span>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
