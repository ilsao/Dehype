<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Replay</title>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">DEHYPE / LOCAL SESSION</p>
          <h1>Decision Replay</h1>
          <p id="session-meta">Loading session...</p>
        </div>
        <div class="header-actions">
          <button id="analyze" type="button">Analyze</button>
          <button id="reset" class="secondary" type="button">Reset</button>
        </div>
      </header>
      <section class="intent-panel" aria-labelledby="intent-heading">
        <div>
          <p class="section-label">Intent</p>
          <h2 id="intent-heading">Keep the decision visible</h2>
        </div>
        <label>Budget <input id="budget" type="text" placeholder="$30" /></label>
        <button id="save-intent" class="secondary" type="button">Save</button>
      </section>
      <section aria-labelledby="timeline-heading">
        <div class="section-heading"><p class="section-label">Sequence</p><h2 id="timeline-heading">Timeline</h2></div>
        <ol id="timeline" class="timeline"><li class="empty">No product activity yet.</li></ol>
      </section>
      <section aria-labelledby="products-heading">
        <div class="section-heading"><p class="section-label">Snapshot</p><h2 id="products-heading">Products Viewed</h2></div>
        <div id="products" class="products"><p class="empty">No products viewed yet.</p></div>
      </section>
      <section aria-labelledby="analysis-heading">
        <div class="section-heading"><p class="section-label">Optional</p><h2 id="analysis-heading">Analysis</h2></div>
        <div id="analysis" class="analysis"><p class="empty">Analysis stays on demand and does not affect collection.</p></div>
      </section>
    </main>
    <script type="module" src="./decisionReplay.js"></script>
  </body>
</html>
